# DeepThought v2 standalone demo configuration.
base_url = "https://deepthought-theme.netlify.app"
title = "DeepThought v2"
description = "A typography-first, no-motion Zola theme for long-form writing."
default_language = "en"
output_dir = "public"
compile_sass = false
minify_html = false
generate_feeds = true
feed_filenames = ["rss.xml"]

# The demo exercises the search UI and its generated index.
build_search_index = true

taxonomies = [
    { name = "categories", feed = true, paginate_by = 10 },
    { name = "tags", feed = true, paginate_by = 10 },
]

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
theme = "github-dark-accessible"
extra_themes = ["highlighting/github-dark-accessible.json"]

[search]
include_title = true
include_description = true
include_path = false
include_content = true

[extra]
# Site-specific examples for optional reusable components.
featured_page = "posts/post-0.md"
navbar_items = [
    { code = "en", nav_items = [
        { url = "$BASE_URL/", name = "Home" },
        { url = "$BASE_URL/posts/", name = "Posts" },
        { url = "$BASE_URL/docs/", name = "Docs" },
        { url = "$BASE_URL/tags/", name = "Tags" },
        { url = "$BASE_URL/categories/", name = "Categories" },
        { url = "$BASE_URL/policy/", name = "Demo policy" },
    ] },
]

[extra.policy]
label = "Demo policy"
url = "$BASE_URL/policy/"

[extra.favicon]
favicon_16x16 = "/icons/favicon-16x16.png"
favicon_32x32 = "/icons/favicon-32x32.png"
apple_touch_icon = "/icons/apple-touch-icon.png"
safari_pinned_tab = "/icons/safari-pinned-tab.svg"
webmanifest = "/icons/site.webmanifest"

[extra.author]
name = "DeepThought v2"
avatar = "/images/avatar.png"

[extra.social]
