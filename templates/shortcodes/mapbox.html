{% component mapbox(access_token, zoom=6) %}
<div class="map mb-6" style='height: 450px;'>
    <div class="mapbox-access-token">
        {{access_token}}
    </div>
    <div class="mapbox-zoom">
        {{zoom}}
    </div>
     <div class="mapbox-geojson">
        {{body}}
    </div>
</div>
{% endcomponent %}
